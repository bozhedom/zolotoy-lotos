<!-- ЗОЛОТОЙ ЛОТОС · 02 · Главный экран (фото гор, заголовок, кнопка)
     Блок T123 «HTML-код». Ставится вторым, сразу после шапки.
     Заменить: ссылку на фото (загрузить guilin-view.jpg в Тильду). -->
<style>
.zl-hero { --ink:#1f2a24; --muted:#66756c; --line:#dfe4dc; --surface:#fff; --f-head:'Prata',Georgia,serif; --f-body:'Manrope',Arial,sans-serif;
           max-width:1200px; margin:0 auto; padding:8px 16px 0; font:16px/1.6 var(--f-body); color:var(--ink); }
.zl-hero *, .zl-hero *::before, .zl-hero *::after { box-sizing:border-box; }
.zl-hero__frame { position:relative; display:grid; align-items:center; min-height:540px; border-radius:22px; overflow:hidden; color:#fff; }
.zl-hero__bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.zl-hero__frame::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(18,30,24,.78) 0%, rgba(18,30,24,.45) 45%, rgba(18,30,24,0) 75%); }
.zl-hero__c { position:relative; z-index:1; max-width:680px; padding:48px clamp(22px,5vw,64px); display:grid; gap:18px; justify-items:start; }
.zl-hero h1 { margin:0; font:400 clamp(30px,4.2vw,52px)/1.14 var(--f-head); color:#fff; text-wrap:balance; }
.zl-hero p { margin:0 0 8px; font-size:18px; color:rgba(255,255,255,.88); }
.zl-hero__btn { display:inline-flex; align-items:center; min-height:48px; padding:0 24px; border-radius:10px; background:#fff; color:var(--ink); font-weight:600; text-decoration:none; transition:transform .25s; }
.zl-hero__btn:hover { transform:translateY(-1px); }
.zl-facts { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin:16px 0 0; padding:0; list-style:none; border-radius:14px; overflow:hidden; background:var(--line); }
.zl-facts li { padding:16px 20px; background:var(--surface); color:var(--muted); font-size:15px; }
.zl-facts b { display:block; font:400 20px/1.3 var(--f-head); color:var(--ink); }
@media (max-width:560px) {
  .zl-hero__frame { min-height:480px; align-items:end; border-radius:16px; }
  .zl-hero__frame::after { background:linear-gradient(180deg, rgba(18,30,24,0) 20%, rgba(18,30,24,.82) 75%); }
  .zl-hero__c { padding:28px 20px; }
  .zl-hero h1 { font-size:28px; }
  .zl-facts { display:none; }
}
</style>

<section class="zl-hero">
  <div class="zl-hero__frame">
    <!-- ЗАМЕНИТЬ: ссылку на фото, загруженное в Тильду -->
    <img class="zl-hero__bg" src="https://bozhedom.github.io/zolotoy-lotos/assets/img/guilin-view.jpg" alt="Горы и река Ли в Гуйлине, Китай">
    <div class="zl-hero__c">
      <h1>Товары для здоровья и&nbsp;красоты из&nbsp;Таиланда, Китая и&nbsp;Кореи</h1>
      <p>Закажите на сайте и заберите в Южно-Сахалинске. Товар можно посмотреть на месте.</p>
      <a class="zl-hero__btn" href="#catalog">Выбрать товары</a>
    </div>
  </div>
  <ul class="zl-facts">
    <li><b>5 разделов</b> лицо, тело, волосы, здоровье, чай</li>
    <li><b>3 страны</b> Таиланд, Китай, Корея</li>
    <li><b>Самовывоз</b> пр. Мира, 229</li>
  </ul>
</section>
